
name: Secure CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Tests and SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install semgrep

      - name: Run tests
        run: |
          mkdir -p reports
          pytest -v --junitxml=reports/test-results.xml

      - name: Bandit security scan
        run: |
          bandit -r app -f json -o reports/bandit-report.json

      - name: Semgrep security scan
        run: |
          semgrep scan --config security/semgrep/rules.yml \
            --json --output reports/semgrep-report.json

      - name: Dependency vulnerability scan
        run: |
          pip-audit -r requirements.txt \
            -f json -o reports/pip-audit-report.json

      - name: Build Docker image
        run: docker build -t vulnfinbot:latest .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vulnfinbot:latest
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM
          output: reports/trivy-report.txt
      
      - name: Start application for DAST
        run: |
          docker run -d --name vulnfinbot-dast -p 5000:5000 vulnfinbot:latest
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:5000/health; then
              break
            fi
            sleep 2
          done

      - name: OWASP ZAP baseline scan
        continue-on-error: true
        run: |
          mkdir -p reports
          chmod -R 777 reports

          docker run --rm --network host \
            --user root \
            -v "$GITHUB_WORKSPACE/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:5000 \
            -J zap-report.json \
            -r zap-report.html

          chmod -R 777 reports

      - name: Stop DAST container
        if: always()
        run: docker rm -f vulnfinbot-dast || true
  


      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn
